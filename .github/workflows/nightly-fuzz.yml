name: Nightly fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    name: fuzz 30m library heap
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Build and run fuzz
        run: |
          mkdir -p bin
          crystal build --release bench/fuzz.cr -o bin/fuzz
          # fuzz.cr only accepts --seconds= / --seed= (positional args were a no-op).
          ./bin/fuzz --seconds=1800 --seed=42
