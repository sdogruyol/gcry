name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC
  # The soak is the only gate that can see a rare cross-thread corruption, and
  # until now the only way to run it was to wait for Monday. Inputs are passed
  # through `env:` rather than interpolated into a script body, so a dispatch
  # cannot inject shell.
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Soak duration in seconds (a GitHub-hosted job is cancelled at 6 h)"
        default: "18000"
      monitor_gate:
        description: "MonitorGate: on = tip default, off = pre-fix behaviour (positive control)"
        type: choice
        options: ["on", "off"]
        default: "on"
      stall_ms:
        description: "GCRY_STW_TEST_STALL_MS — widens the stopped window so a rare overlap becomes frequent. Research only; 0 for a normal soak."
        default: "0"
      lcr_attempts:
        description: "aarch64 large-cache-race rate: attempts per arm. 0 skips the job. The locked arm faulted 1 of 5 on run 32862284372 and this is how many samples that number gets."
        default: "0"
      ec_queue_audit:
        description: "GCRY_EC_QUEUE_AUDIT — walk the Parallel run queues each collection and report the first slot that stops being a live Fiber. 'off' to disable."
        required: false
        default: "on"
      poison_freed:
        description: "GCRY_POISON_HOLDERS — poison freed payloads with 0xdeadf2ee…, tag each with the freed block's address, and on a fault name what still points at it. 'off' to disable."
        required: false
        default: "on"
      fiber_churn:
        description: "Soak --fiber-churn=N: fibers per 1 ms burst, to keep the run queues occupied so the queue audit has something to look at. 0 = the baseline workload every earlier soak ran."
        required: false
        default: "0"
      soak_rss_limit_kb:
        description: "Soak --rss-limit-kb. Churn holds thousands of fiber stacks (+44.7 MB measured over 25 s at 512), so a churn arm needs this raised."
        required: false
        default: "4096"
      collect_hz:
        description: "Soak --collect-hz=N: collections per second. The audit only sees a slot that is corrupt while a collection looks at it, so chances = collections x occupancy; churn raised occupancy, this raises the other factor. 20 measured 19x the collections at a *lower* pause. 1 = the baseline every earlier soak ran."
        required: false
        default: "1"
      page_query_pressure:
        description: "MiB of churn for the Darwin mach_vm_page_query probe's eviction arm, the one case the low-water question turns on. The runner will not compress on its own, so that arm returns INCONCLUSIVE at 0 (the default, and what every push runs). Set it to attempt the arm; too much can take the job down with it."
        required: false
        default: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # There were two arms here, `latest` and this pinned one. On 2026-08-16
          # GitHub's releases-list endpoint for crystal-lang/crystal began
          # returning an empty array — `releases/latest` and the tags stayed
          # correct — so install-crystal, which resolves `latest` off that list,
          # asked for version `null` and took ten of the twelve jobs down. Every
          # `latest` in this file is pinned for that reason. 1.21.0 was `latest`
          # on the day of the pin, so the two arms became the same job and one
          # was dropped. When the endpoint recovers, a `latest` arm is worth
          # bringing back: it is the only thing that tells us a compiler release
          # broke the collector.
          - os: ubuntu-latest
            crystal: "1.21.0"
            arch_label: x86_64
    runs-on: ${{ matrix.os }}
    # Measured 2026-09-15: 29m44s green, 30m05s cancelled on the last step
    # (`GCRY_SOUND=1`, 17 s of work left). The comment used to say ~7 minutes;
    # the gate list grew. The 30-minute cap was for a hang in
    # `stw_mt_property_test` (glibc queried a suspended thread, 2026-08-10,
    # six hours until GitHub's ceiling). That hang is fixed; 45 minutes still
    # fails a hang in minutes, not hours, and leaves runner variance a margin.
    timeout-minutes: 45
    name: test (${{ matrix.arch_label }}, crystal ${{ matrix.crystal }})
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Create output dir
        run: mkdir -p bin

      - name: Check formatting
        run: crystal tool format --check

      # `make lint`, not an inline script: the inline one `cd lib/ameba`'d to build
      # the binary and never came back, so `../../bin/ameba` ran with the working
      # directory still inside ameba's own checkout. It linted **ameba** — 346
      # files, gcry's config not even loaded — and had done so for every green run
      # on record. The Makefile target runs each line in its own shell, so the
      # binary runs from the repo root. gcry is 82 files, and the first honest run
      # found 10 issues.
      - name: Ameba
        run: make lint

      # Catch a Darwin-only compile break here rather than on the macOS runner
      # at the end of the matrix: Gcry::Platform is two files that must present
      # the same surface, and a Linux-only method called unconditionally from
      # GC.init compiles fine on this job and fails there.
      - name: Darwin type-check (cross-compile)
        run: make darwin-typecheck

      # A knob nobody documented is a knob nobody can find. The env reference
      # had drifted by 33 before this step existed.
      - name: Env knob reference is complete
        run: make knob-doc-check

      # A line longer than its own stack buffer is a smash, not a truncation:
      # the crash report's kept-release line ran 121 bytes past a 256-byte
      # buffer and killed the report inside itself.
      - name: Raw line buffers fit their writer
        run: make raw-buf-check

      # And a gate that pins one of those inert knobs must build the layout
      # that honours it, or it silently measures the configuration it was
      # avoiding: both page-release gates had rotted that way, reporting
      # `unlinked 0` and `walk 0 B` where the walk never ran.
      - name: Gates build the layout their knobs need
        run: make layout-knob-check

      # A knob the compile default cannot honour must say so. Three of them
      # became inert when headerless became the default, and their env reads
      # are compiled out on that layout, so nothing else would notice.
      - name: Knobs the default ignores warn about it
        run: make ignored-knob-warnings

      - name: Unit specs (library heap under Boehm)
        run: crystal spec --error-trace

      - name: Process GC specs (-Dgc_none)
        run: |
          # Spec + process GC can rarely SEGV during Spec::Result reporting on
          # shared runners; retry a couple times. Heavy cases live in standalone benches.
          ok=0
          for i in 1 2 3; do
            if crystal spec -Dgc_none process_spec --error-trace; then
              ok=1
              break
            fi
            echo "process_spec failed (attempt $i), retrying..."
          done
          test "$ok" = 1

      # The headerless layout is the compile default, so the plain runs above
      # cover it. The 16-byte header layout is `-Dgcry_block_headers` and keeps
      # its own arms: the bitmap allocator on it (the 0.24.x process default)
      # and the freelist (`GCRY_BITMAP_ALLOC=0`, which is only a knob on the
      # header layout — headerless forces the bitmap representation). Library
      # heaps on the header layout keep the freelist unless `=1`, so the unit
      # suite runs both ways there.
      - name: Unit specs (header layout, freelist)
        run: crystal spec -Dgcry_block_headers --error-trace

      - name: Unit specs (header layout, bitmap allocator)
        run: GCRY_BITMAP_ALLOC=1 crystal spec -Dgcry_block_headers --error-trace

      - name: Process GC specs (header layout, bitmap allocator)
        run: crystal spec -Dgc_none -Dgcry_block_headers process_spec --error-trace

      - name: Process GC specs (header layout, freelist)
        run: GCRY_BITMAP_ALLOC=0 crystal spec -Dgc_none -Dgcry_block_headers process_spec --error-trace

      # The third representation on that layout: marks in the chunk while the
      # freelist allocator keeps handing out header-carrying blocks. Shipped,
      # documented, and unrun until 2026-09-14 — the step above it covers
      # marks-plus-pool, the one below covers headers-plus-freelist, and the
      # `GCRY_BITMAP=1 ./bin/hello_env` line further down sets that knob on a
      # binary built headerless, which ignores it.
      - name: Marks in the chunk with the freelist allocator
        run: make bitmap-marks-freelist

      - name: Sample hello (header layout)
        run: |
          crystal build -Dgc_none -Dgcry_block_headers samples/hello.cr -o bin/hello_hdr
          ./bin/hello_hdr

      - name: Sample hello (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/hello.cr -o bin/hello
          ./bin/hello

      - name: Sample min (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/min.cr -o bin/min
          ./bin/min

      - name: Sample alloc (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/alloc.cr -o bin/alloc
          ./bin/alloc 500

      - name: Sample stress (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/stress.cr -o bin/stress
          ./bin/stress 300

      - name: Sample json_churn (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/json_churn.cr -o bin/json_churn
          ./bin/json_churn 800

      - name: Env knobs smoke (nursery / chunks / incremental / stress)
        run: |
          crystal build -Dgc_none samples/hello.cr -o bin/hello_env
          # Knobs that only exist on the header layout (nursery, freelist,
          # TLAB) are ignored on the headerless default; exercise them on the
          # layout that reads them.
          crystal build -Dgc_none -Dgcry_block_headers samples/hello.cr -o bin/hello_env_hdr
          GCRY_DISABLE_AUTO=1 ./bin/hello_env
          GCRY_DISABLE_NURSERY=1 ./bin/hello_env
          GCRY_NURSERY=262144 ./bin/hello_env
          GCRY_NURSERY=262144 ./bin/hello_env_hdr
          GCRY_KEEP_CHUNKS=1 ./bin/hello_env
          GCRY_RELEASE_CHUNKS=1 ./bin/hello_env
          # timeout: GCRY_STRESS × SYSMON/Thread.lock deadlock used to hang the job for hours
          timeout 60 env GCRY_STRESS=1 GCRY_STRESS_EVERY=8 ./bin/hello_env
          GCRY_MPROTECT_BARRIER=1 ./bin/hello_env
          GCRY_INCREMENTAL=1 ./bin/hello_env
          GCRY_BITMAP=1 ./bin/hello_env
          GCRY_BITMAP_ALLOC=0 ./bin/hello_env
          GCRY_BITMAP_ALLOC=0 ./bin/hello_env_hdr
          GCRY_BITMAP_ALLOC=0 GCRY_CHUNK_RADIX=1 ./bin/hello_env_hdr
          GCRY_BITMAP_ALLOC=0 GCRY_TLAB=1 ./bin/hello_env_hdr
          GCRY_SIMD=off ./bin/hello_env
          GCRY_SIMD=scalar GCRY_BITMAP_ALLOC=1 ./bin/hello_env
          GCRY_PREFETCH=0 ./bin/hello_env
          GCRY_COLLECT_SCRUB=0 ./bin/hello_env
          GCRY_PARALLEL_MARK=4 ./bin/hello_env

      # The SIMD kernels' scalar-vs-backend equivalence fuzz in the shipping
      # optimisation mode, followed by the IR gate. `make kernels-ir` asks
      # both architectures the question — cross-emitted IR needs the target's
      # compiler, not its CPU — so the aarch64 assertions run here on every
      # PR rather than only beside the aarch64 object-emit smoke, and each
      # arch asserts the other's fingerprints are absent so a grep that can
      # never match is not mistaken for a grep that matches. The
      # broken-backend positive control refuses to run on a scalar-only host
      # rather than passing vacuously.
      - name: SIMD kernel equivalence (release)
        run: |
          crystal spec --release spec/kernels_spec.cr --error-trace
          make kernels-ir
          make kernels-broken

      - name: Sample stress under GCRY_STRESS
        run: |
          timeout 120 env GCRY_STRESS=1 GCRY_STRESS_EVERY=32 ./bin/stress 100

      - name: Bench churn (library heap)
        run: |
          crystal build bench/churn.cr -o bin/churn
          ./bin/churn 500

      - name: Fuzz short (library heap)
        run: |
          crystal build bench/fuzz.cr -o bin/fuzz
          ./bin/fuzz --seconds=5 --seed=1

      - name: Fuzz with log + replay
        run: |
          ./bin/fuzz --seconds=3 --seed=42 --log=/tmp/fuzz-ci.log
          echo "--- replay ---"
          ./bin/fuzz --replay=/tmp/fuzz-ci.log

      - name: Property test (5000 iterations + invariants)
        run: |
          crystal build bench/property_test.cr -o bin/property_test
          ./bin/property_test --seed=1 --iterations=5000

      - name: Layout property test (500 iterations)
        run: |
          crystal build bench/layout_property_test.cr -o bin/layout_property_test
          ./bin/layout_property_test --seed=1 --iterations=500

      - name: MT property test (50 iterations, 2+4 workers)
        run: |
          crystal build bench/mt_property_test.cr -o bin/mt_property_test
          ./bin/mt_property_test --seed=1 --iterations=50 --workers=2,4

      - name: Process-GC STW MT property test (50 iterations, 2+4 workers)
        env:
          # A hang here prints `STOP-THE-WORLD STALLED <n> ms in phase=<name>`
          # instead of going quiet for six hours. 10 s, well clear of the 5 s
          # that `bench/stw_watchdog.cr` already established as CI-proof against
          # a runner simply descheduling the collector.
          GCRY_STW_WATCHDOG_MS: "10000"
          # This gate caught the open use-after-free on 2026-08-17 — SIGSEGV in
          # `pthread_getattr_np` under `stop_world`, on **x86_64**, in a harness
          # that uses plain `Thread.new` — and could say nothing about it,
          # because the diagnostics were not on here. They cost a memset per
          # free and nothing until something faults; a gate that catches this
          # defect should not waste the sighting.
          GCRY_POISON_HOLDERS: "1"
          GCRY_THREAD_CENSUS: "1"

