name: CI
on: [push]
jobs:
  kemal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: timeout 240 sudo apt-get update -qq -o Acquire::http::Timeout=30 -o Acquire::Retries=2
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"
      - run: sudo apt-get install -y wrk
      - run: ci/probe/kemal.sh
  metric:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: timeout 240 sudo apt-get update -qq -o Acquire::http::Timeout=30 -o Acquire::Retries=2
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"
      - run: mkdir -p bin && ci/probe/metric.sh
