name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC
  # The soak is the only gate that can see a rare cross-thread corruption, and
  # until now the only way to run it was to wait for Monday. Inputs are passed
  # through `env:` rather than interpolated into a script body, so a dispatch
  # cannot inject shell.
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Soak duration in seconds (a GitHub-hosted job is cancelled at 6 h)"
        default: "18000"
      monitor_gate:
        description: "MonitorGate: on = tip default, off = pre-fix behaviour (positive control)"
        type: choice
        options: ["on", "off"]
        default: "on"
      stall_ms:
        description: "GCRY_STW_TEST_STALL_MS — widens the stopped window so a rare overlap becomes frequent. Research only; 0 for a normal soak."
        default: "0"
      lcr_attempts:
        description: "aarch64 large-cache-race rate: attempts per arm. 0 skips the job. The locked arm faulted 1 of 5 on run 32862284372 and this is how many samples that number gets."
        default: "0"
      ec_queue_audit:
        description: "GCRY_EC_QUEUE_AUDIT — walk the Parallel run queues each collection and report the first slot that stops being a live Fiber. 'off' to disable."
        required: false
        default: "on"
      poison_freed:
        description: "GCRY_POISON_HOLDERS — poison freed payloads with 0xdeadf2ee…, tag each with the freed block's address, and on a fault name what still points at it. 'off' to disable."
        required: false
        default: "on"
      fiber_churn:
        description: "Soak --fiber-churn=N: fibers per 1 ms burst, to keep the run queues occupied so the queue audit has something to look at. 0 = the baseline workload every earlier soak ran."
        required: false
        default: "0"
      soak_rss_limit_kb:
        description: "Soak --rss-limit-kb. Churn holds thousands of fiber stacks (+44.7 MB measured over 25 s at 512), so a churn arm needs this raised."
        required: false
        default: "4096"
      collect_hz:
        description: "Soak --collect-hz=N: collections per second. The audit only sees a slot that is corrupt while a collection looks at it, so chances = collections x occupancy; churn raised occupancy, this raises the other factor. 20 measured 19x the collections at a *lower* pause. 1 = the baseline every earlier soak ran."
        required: false
        default: "1"
      page_query_pressure:
        description: "MiB of churn for the Darwin mach_vm_page_query probe's eviction arm, the one case the low-water question turns on. The runner will not compress on its own, so that arm returns INCONCLUSIVE at 0 (the default, and what every push runs). Set it to attempt the arm; too much can take the job down with it."
        required: false
        default: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # There were two arms here, `latest` and this pinned one. On 2026-08-16
          # GitHub's releases-list endpoint for crystal-lang/crystal began
          # returning an empty array — `releases/latest` and the tags stayed
          # correct — so install-crystal, which resolves `latest` off that list,
          # asked for version `null` and took ten of the twelve jobs down. Every
          # `latest` in this file is pinned for that reason. 1.21.0 was `latest`
          # on the day of the pin, so the two arms became the same job and one
          # was dropped. When the endpoint recovers, a `latest` arm is worth
          # bringing back: it is the only thing that tells us a compiler release
          # broke the collector.
          - os: ubuntu-latest
            crystal: "1.21.0"
            arch_label: x86_64
    runs-on: ${{ matrix.os }}
    # This job takes ~7 minutes. It once took six hours: on 2026-08-10 it hung in
    # `stw_mt_property_test` (the collector asking glibc about a thread it had
    # suspended, fixed in 8f2cdad) and only stopped when the runner cancelled it
    # at GitHub's 6 h ceiling. A hang should cost minutes and say so.
    timeout-minutes: 30
    name: test (${{ matrix.arch_label }}, crystal ${{ matrix.crystal }})
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Create output dir
        run: mkdir -p bin

      - name: Check formatting
        run: crystal tool format --check

      # `make lint`, not an inline script: the inline one `cd lib/ameba`'d to build
      # the binary and never came back, so `../../bin/ameba` ran with the working
      # directory still inside ameba's own checkout. It linted **ameba** — 346
      # files, gcry's config not even loaded — and had done so for every green run
      # on record. The Makefile target runs each line in its own shell, so the
      # binary runs from the repo root. gcry is 82 files, and the first honest run
      # found 10 issues.
      - name: Ameba
        run: make lint

      # Catch a Darwin-only compile break here rather than on the macOS runner
      # at the end of the matrix: Gcry::Platform is two files that must present
      # the same surface, and a Linux-only method called unconditionally from
      # GC.init compiles fine on this job and fails there.
      - name: Darwin type-check (cross-compile)
        run: make darwin-typecheck

      # A knob nobody documented is a knob nobody can find. The env reference
      # had drifted by 33 before this step existed.
      - name: Env knob reference is complete
        run: make knob-doc-check

      - name: Unit specs (library heap under Boehm)
        run: crystal spec --error-trace

      - name: Process GC specs (-Dgc_none)
        run: |
          # Spec + process GC can rarely SEGV during Spec::Result reporting on
          # shared runners; retry a couple times. Heavy cases live in standalone benches.
          ok=0
          for i in 1 2 3; do
            if crystal spec -Dgc_none process_spec --error-trace; then
              ok=1
              break
            fi
            echo "process_spec failed (attempt $i), retrying..."
          done
          test "$ok" = 1

      - name: Sample hello (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/hello.cr -o bin/hello
          ./bin/hello

      - name: Sample min (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/min.cr -o bin/min
          ./bin/min

      - name: Sample alloc (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/alloc.cr -o bin/alloc
          ./bin/alloc 500

      - name: Sample stress (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/stress.cr -o bin/stress
          ./bin/stress 300

      - name: Sample json_churn (-Dgc_none)
        run: |
          crystal build -Dgc_none samples/json_churn.cr -o bin/json_churn
          ./bin/json_churn 800

      - name: Env knobs smoke (nursery / chunks / incremental / stress)
        run: |
          crystal build -Dgc_none samples/hello.cr -o bin/hello_env
          GCRY_DISABLE_AUTO=1 ./bin/hello_env
          GCRY_DISABLE_NURSERY=1 ./bin/hello_env
          GCRY_NURSERY=262144 ./bin/hello_env
          GCRY_KEEP_CHUNKS=1 ./bin/hello_env
          GCRY_RELEASE_CHUNKS=1 ./bin/hello_env
          # timeout: GCRY_STRESS × SYSMON/Thread.lock deadlock used to hang the job for hours
          timeout 60 env GCRY_STRESS=1 GCRY_STRESS_EVERY=8 ./bin/hello_env
          GCRY_MPROTECT_BARRIER=1 ./bin/hello_env
          GCRY_INCREMENTAL=1 ./bin/hello_env

      - name: Sample stress under GCRY_STRESS
        run: |
          timeout 120 env GCRY_STRESS=1 GCRY_STRESS_EVERY=32 ./bin/stress 100

      - name: Bench churn (library heap)
        run: |
          crystal build bench/churn.cr -o bin/churn
          ./bin/churn 500

      - name: Fuzz short (library heap)
        run: |
          crystal build bench/fuzz.cr -o bin/fuzz
          ./bin/fuzz --seconds=5 --seed=1

      - name: Fuzz with log + replay
        run: |
          ./bin/fuzz --seconds=3 --seed=42 --log=/tmp/fuzz-ci.log
          echo "--- replay ---"
          ./bin/fuzz --replay=/tmp/fuzz-ci.log

      - name: Property test (5000 iterations + invariants)
        run: |
          crystal build bench/property_test.cr -o bin/property_test
          ./bin/property_test --seed=1 --iterations=5000

      - name: Layout property test (500 iterations)
        run: |
          crystal build bench/layout_property_test.cr -o bin/layout_property_test
          ./bin/layout_property_test --seed=1 --iterations=500

      - name: MT property test (50 iterations, 2+4 workers)
        run: |
          crystal build bench/mt_property_test.cr -o bin/mt_property_test
          ./bin/mt_property_test --seed=1 --iterations=50 --workers=2,4

      - name: Process-GC STW MT property test (50 iterations, 2+4 workers)
        env:
          # A hang here prints `STOP-THE-WORLD STALLED <n> ms in phase=<name>`
          # instead of going quiet for six hours. 10 s, well clear of the 5 s
          # that `bench/stw_watchdog.cr` already established as CI-proof against
          # a runner simply descheduling the collector.
          GCRY_STW_WATCHDOG_MS: "10000"
          # This gate caught the open use-after-free on 2026-08-17 — SIGSEGV in
          # `pthread_getattr_np` under `stop_world`, on **x86_64**, in a harness
          # that uses plain `Thread.new` — and could say nothing about it,
          # because the diagnostics were not on here. They cost a memset per
          # free and nothing until something faults; a gate that catches this
          # defect should not waste the sighting.
          GCRY_POISON_HOLDERS: "1"
          GCRY_THREAD_CENSUS: "1"
          # What those diagnostics still could not say: what held the `Thread`'s
          # address at the moment its block was swept. This arm answers it from
          # inside the collection that frees it, instead of from the crash one
          # collection later (src/gcry/thread_block_audit.cr). Measured on this
          # step: +3% wall clock, and it reports nothing locally — which is the
          # point, because this defect has never reproduced off CI.
          GCRY_THREAD_BLOCK_AUDIT: "1"
        run: |
          crystal build -Dgc_none bench/stw_mt_property_test.cr -o bin/stw_mt_property_test
          ./bin/stw_mt_property_test --seed=1 --iterations=50 --workers=2,4

      - name: Process-GC STW MT property test with TLAB (50 iterations, 2+4 workers)
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
          # The diagnostics are on the arm above *and* on these two now, because
          # the catches are down here. Both x86_64 failures of this harness —
          # 2026-08-17 and the Darwin one on 2026-08-22 — were in `--tlab
          # --nursery`, and neither could say anything: no poison, no report, no
          # census. The plain arm has never failed.
          GCRY_POISON_HOLDERS: "1"
          GCRY_THREAD_CENSUS: "1"
          GCRY_THREAD_BLOCK_AUDIT: "1"
        run: |
          crystal build -Dgc_none bench/stw_mt_property_test.cr -o bin/stw_mt_property_test
          ./bin/stw_mt_property_test --tlab --seed=1 --iterations=50 --workers=2,4

      - name: Process-GC STW MT property test with TLAB+nursery (50 iterations, 2+4 workers)
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
          # This is the arm that has actually crashed, twice, on two platforms.
          # `GCRY_POISON_HOLDERS` implies the freed-payload poison, the address
          # tag and the SIGSEGV report, so a fault here names the block it read
          # out of and what still points into it instead of printing one hex
          # number.
          GCRY_POISON_HOLDERS: "1"
          GCRY_THREAD_CENSUS: "1"
          GCRY_THREAD_BLOCK_AUDIT: "1"
        run: |
          crystal build -Dgc_none bench/stw_mt_property_test.cr -o bin/stw_mt_property_test
          ./bin/stw_mt_property_test --tlab --nursery --seed=1 --iterations=50 --workers=2,4

      - name: Process-GC nursery+TLAB minor smoke (single-thread)
        run: |
          crystal build -Dgc_none bench/nursery_tlab_smoke.cr -o bin/nursery_tlab_smoke
          ./bin/nursery_tlab_smoke

      - name: Alloc pattern fuzz (20 phases, 1000 objects)
        run: |
          crystal build -Dgc_none bench/pattern_fuzz.cr -o bin/pattern_fuzz
          ./bin/pattern_fuzz --seed=1 --phases=20 --objects-per-phase=1000

      - name: Process-GC soak smoke (10s)
        run: make soak-smoke

      - name: Thread storm (100 iterations, 4 workers)
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
        run: |
          crystal build -Dgc_none bench/thread_storm.cr -o bin/thread_storm
          ./bin/thread_storm --iterations=100 --workers=4

      - name: OOM test (phases 1,2,3)
        run: |
          crystal build -Dgc_none bench/oom_test.cr -o bin/oom_test
          ./bin/oom_test --phases=1,2,3

      - name: Fork reinit test
        run: |
          crystal build -Dgc_none bench/fork_reinit.cr -o bin/fork_reinit
          ./bin/fork_reinit

      - name: Finalizer complex scenarios
        run: |
          crystal build -Dgc_none bench/finalizer_complex.cr -o bin/finalizer_complex
          ./bin/finalizer_complex

      - name: Nursery HTTP::Headers regression
        run: |
          crystal build -Dgc_none bench/nursery_headers.cr -o bin/nursery_headers
          ./bin/nursery_headers

      - name: Process parallel mark
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
        run: |
          crystal build -Dgc_none bench/parallel_mark_process.cr -o bin/parallel_mark_process
          ./bin/parallel_mark_process

      - name: Microbenchmark suite
        run: |
          crystal build -Dgc_none bench/micro/run_all.cr -o bin/microbench --error-trace
          ./bin/microbench

      - name: Pause budget
        run: |
          crystal build -Dgc_none bench/pause_budget.cr -o bin/pause_budget --error-trace
          ./bin/pause_budget --live-mb=20

      # The pause trap in the sound profile. `GCRY_SOUND=1` sets both STW
      # root-scan lags to 0, and that pair is the *entire* pause cost of the
      # profile — 19× at Kemal EC4, 14.5× on a fat app. The correctness suite
      # below runs under GCRY_SOUND=1 and passes at any pause, so nothing caught
      # it. Both assertions are host-independent (booted lag state, and an upper
      # bound on the lag-0 penalty), so this does not need a quiet runner.
      - name: STW lag pause trap
        run: |
          crystal build -Dgc_none bench/stw_lag_pause.cr -o bin/stw_lag_pause --error-trace
          ./bin/stw_lag_pause --rounds=5
          # Same binary, inverted expectation: the profile must still set 0/0.
          GCRY_SOUND=1 ./bin/stw_lag_pause --rounds=5
          # The low-water skip took this from 13.9x to 1.03x, so the 30x ceiling
          # above no longer catches its loss. Tighten it to 4x — enough headroom
          # for a noisy shared runner, still failing if the full guard→bottom
          # scan returns.
          #
          # The skip needs /proc/self/pagemap, which a hardened kernel or a
          # restricted container can refuse; the collector then falls back to the
          # full scan, which is correct but back at ~14x. The tool detects that
          # and relaxes to --max-ratio-nolw rather than failing the build for a
          # missing capability, so this step never goes red for something that is
          # not a regression.
          ./bin/stw_lag_pause --rounds=5 --max-ratio=4 --max-ratio-nolw=30
          # None of the runs above can see the *default* path regress. They
          # dirty 256 KiB per fiber, exactly the lag, so `tuned` has nothing to
          # skip whether or not the skip reaches it — the low-water code could
          # go back to being gated on lag == 0 and this step would stay green.
          # Shallow fibers give the default path something to skip, and the tool
          # then requires that it does.
          ./bin/stw_lag_pause --rounds=5 --dirty-kb=16 --max-ratio=4 --max-ratio-nolw=30

      # A collector that asks glibc about a thread it has just suspended waits
      # forever, silently. Nothing else in CI can see it: the correctness suite
      # would simply never finish, and a job timeout points at nothing. This
      # reproduces the shape (one fiber holding a worker across the first
      # collection) and was 18/150 before the fix.
      - name: STW hang trap (libc query on a suspended thread)
        run: |
          crystal build -Dgc_none -Dpreview_mt -Dexecution_context \
            bench/stw_startup_hang.cr -o bin/stw_startup_hang --error-trace
          ./bin/stw_startup_hang --spin --children=60 --timeout=10
          # Negative controls: real libc allocation under STW, which is *not* the
          # hazard. They must stay green — if one of these starts hanging, the
          # rule this gate encodes is wrong, not just the code.
          ./bin/stw_startup_hang --spin --finalizers --children=30 --timeout=10

      # The Monitor is not signal-suspended by STW and was measured running —
      # and munmapping fiber stacks — inside the stopped world. This asserts the
      # handshake shuts it out, with GCRY_MONITOR_GATE=0 as the positive control.
      - name: EC Monitor vs the stopped world
        run: |
          crystal build -Dgc_none -Dtracing bench/stw_monitor_gate.cr \
            -o bin/stw_monitor_gate --error-trace
          ./bin/stw_monitor_gate

      # The diagnostic that makes the trap above debuggable when it does fire.
      # Driven from both sides in one run: fires on a stall, silent otherwise.
      - name: STW watchdog
        run: |
          crystal build -Dgc_none bench/stw_watchdog.cr -o bin/stw_watchdog --error-trace
          ./bin/stw_watchdog

      # A suspended thread's registers can hold the only live copy of a
      # reference. Darwin asked for them and got an empty stub, and swept live
      # objects for it (2936248). Linux reads them from the signal ucontext, so
      # this is a different implementation of the same contract — running the
      # gate here is what turns "does Linux have the same gap?" from an open
      # question into an answered one.
      # And the widest root range of all, which had a size cap on it: gcry finds
      # a program's BSS by adjacency to the executable's .data, and used to
      # refuse it if it was larger than 1 MiB — dropping every class variable
      # and constant slot in it. An 8 MiB static array was enough to get STDERR
      # collected. Two binaries, because the second threshold is a scan limit
      # rather than a parser one.
      - name: Static BSS roots
        run: |
          make static-bss-roots

      # The executable's mappings are identified by address, not pathname: a
      # redeploy renames every maps line of the running image to "(deleted)",
      # and a parser that compared against /proc/self/exe lost .data and the
      # BSS at the next refresh. The child deletes its own binary and checks a
      # class-variable array survives the refresh.
      - name: Static roots across a redeploy
        run: |
          make static-roots-redeploy

      - name: Suspended-thread register roots
        run: |
          make greg-roots

      # The same question one level up: scan_thread_roots pins the Parallel EC's
      # queues, event loop and schedulers by name, and the whole block sits behind
      # a macro gate on Thread.@execution_context. A gate that compiles a root
      # scan out looks, from outside, exactly like one that ran and found
      # nothing — which is how the two register gaps above went unnoticed.
      - name: Parallel EC scheduler root pins
        run: |
          make scheduler-roots

      # And one level down: a precise layout is a claim about *every* pointer in
      # the object, and `Layout.register` had a bucket it never named — an ivar it
      # could not classify (module-typed, Proc, Tuple) got no offset and did not
      # force the conservative fallback, so the word was never scanned. 19 such
      # ivars in 186 stdlib types, `Fiber#proc` among them. Same shape as the two
      # register gaps above: a root the caller assumed was covered.
      - name: Unclassified ivar layout roots
        run: |
          make ivar-layout-roots

      # And the consumer side: the run queues the scheduler dequeues from. The
      # 2026-08-10 soak SEGV'd on a slot whose pointer had been partly
      # overwritten, an hour after whatever wrote it. `GCRY_EC_QUEUE_AUDIT=1`
      # names the first collection that sees such a slot; this gate proves it
      # names the planted value rather than something downstream of it.
      - name: EC run-queue audit
        # The same bound as the aarch64 job, for the same reason: this is the
        # gate that hangs there. A step timeout fails with the log; a job
        # timeout cancels with nothing.
        timeout-minutes: 5
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
        run: |
          make ec-queue-audit

      # And the other half of "make the next crash legible": a freed payload
      # becomes 0xdeadf2eedeadf2ee. The gate's second arm is the one that
      # matters — poisoning must not break the freelist-clean fast path, or a
      # cleared malloc hands out poison.
      - name: Poison on free
        run: |
          make poison-freed

      # And the reporter that reads the poison back: a crash now says whether
      # the address was in the heap, in a free block, in a used one, or nowhere
      # gcry mapped. Tested by crashing, one child process per shape.
      - name: SIGSEGV report
        run: |
          make segv-report

      # And the step after naming the block: naming what still points at it.
      # The open fiber-creation UAF stopped at "the block is a Deque buffer the
      # deque abandoned"; this searches the root set, the live heap and the
      # fiber stacks for that address at fault time. Plants holders on purpose,
      # because a search that finds nothing looks like one that found the heap
      # clean.
      - name: Use-after-free holders
        run: |
          make poison-holders

      # And the question the holder search opened: is the mark complete at all?
      # Walks every marked block after mark and before sweep and names any
      # pointer into a block the sweep is about to free. The gate plants one it
      # knows the shape of, so a silent audit cannot pass.
      - name: Mark completeness audit
        run: |
          make mark-audit

      # And the same window aimed at one type. The `Thread` use-after-free is
      # only ever observed on CI, so the arm that asks where a dying `Thread`'s
      # address lives has to be trusted before its silence there means anything.
      # Three arms: a dropped object of the watched type must be named, the same
      # objects held alive must produce no deaths, and the shipped default must
      # find live `Thread` blocks — a default aimed at nothing would be quiet on
      # CI for a reason that has nothing to do with the defect.
      - name: Dying-type audit
        run: |
          make thread-block-audit

      # And the fix that window's report named: the `Thread` object is rooted
      # from `pthread_create` until the thread publishes itself. The gate holds
      # the window open with a raw pthread that never joins Crystal's list, and
      # requires the block to die with the root off — so the survival is the
      # root's doing and not the harness's.
      - name: Thread-birth root
        run: |
          make thread-birth-root

      # The other half of the birth window: the record the pre-stop wait uses.
      # A full staging table used to refuse the birth being handed in — the
      # newest one, i.e. the thread actually inside the window — so that thread
      # was never waited for and the world stopped with it unpublished, neither
      # suspended nor scanned.
      - name: Thread staging table
        run: |
          make thread-staging

      # `chunk_containing` skips its lock while the world is stopped, which is
      # only sound if nothing but the collector can be there. `start_world`
      # resumed every thread before clearing that flag, so every mutator took
      # the unlocked path against a peer's index mutation — 160 687 such reads
      # per run, measured.
      - name: STW chunk-index race
        run: |
          make stw-index-race

      # The allocator hands out large chunks under @alloc_lock while the cache
      # trim walks the same list. Deterministic both ways: the old behaviour
      # faults 5 of 5, serialised 0 of 5.
      - name: Large-cache race
        run: |
          make large-cache-race

      # A mutator inside `find_block` while collections run. It used to crash on
      # a chunk pointer the last-chunk cache handed back after reading its index
      # twice; the arm that restores that read must still crash, or the green
      # one says nothing.
      - name: find_block race
        env:
          FIND_BLOCK_RACE_RUNS: "3"
        run: |
          make find-block-race

      # And the counters those threads share: four of them allocate a known
      # number of objects and every one must be accounted for, while the old
      # plain-store path must be shown to lose some.
      - name: Heap counters
        run: |
          make heap-counters

      # The perf gates are floors far below tip, so a regression that lands
      # inside one is invisible (85% -> 70% clears all of them). The baseline
      # comparator closes that; this gates the comparator itself, which needs
      # neither wrk nor a quiet host.
      - name: Perf baseline comparator
        run: |
          make perf-baseline

      - name: RSS leak detection
        run: |
          crystal build -Dgc_none bench/rss_leak.cr -o bin/rss_leak --error-trace
          # Primary gate: heap_size late vs early. RSS secondary with looser ceil
          # (DONTNEED re-fault is noisy on shared GHA hosts).
          ./bin/rss_leak --warmup=20 --cycles=20 --objects=5000 --limit=15 --rss-limit=30

      - name: Compiler GC contract + crystal tools
        run: |
          crystal build -Dgc_none bench/compiler_gc_contract.cr -o bin/compiler_gc_contract --error-trace
          ./bin/compiler_gc_contract
          crystal tool hierarchy src/gcry.cr >/dev/null
          crystal tool unreachable bench/compiler_gc_contract.cr -Dgc_none >/dev/null

      - name: Trace + heap dump smoke
        run: |
          crystal build bench/trace_smoke.cr -o bin/trace_smoke --error-trace
          ./bin/trace_smoke

      - name: Debug invariants
        run: |
          GCRY_DEBUG_INVARIANTS=1 crystal spec --error-trace

      # Root-completeness profile (docs/SOUND-DEFAULTS.md). The sample asserts
      # the *observed* heap state matches GCRY_SOUND, so a root heuristic added
      # later but forgotten in apply_sound_profile fails here.
      - name: Sound-roots profile smoke
        run: |
          crystal build -Dgc_none samples/sound_profile.cr -o bin/sound_profile
          ./bin/sound_profile
          GCRY_SOUND=1 ./bin/sound_profile
          # An explicit knob must still override the profile.
          GCRY_SOUND=1 GCRY_SCRUB_FIBERS=1 ./bin/sound_profile
          # Barrier axis: sound roots + a page-dirty barrier must demote the label.
          GCRY_SOUND=1 GCRY_NURSERY=262144 ./bin/sound_profile

      # The sound profile is the configuration a correctness claim cites, so it
      # has to stay green — a heuristic-off path that only runs at bench time
      # would rot. Reuses binaries built above.
      - name: Correctness suite under GCRY_SOUND=1
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
        run: |
          GCRY_SOUND=1 ./bin/stress 300
          GCRY_SOUND=1 ./bin/json_churn 800
          GCRY_SOUND=1 ./bin/alloc 500
          GCRY_SOUND=1 ./bin/pattern_fuzz --seed=1 --phases=20 --objects-per-phase=1000
          GCRY_SOUND=1 ./bin/thread_storm --iterations=100 --workers=4
          GCRY_SOUND=1 ./bin/finalizer_complex
          GCRY_SOUND=1 ./bin/nursery_headers
          GCRY_SOUND=1 ./bin/stw_mt_property_test --seed=1 --iterations=50 --workers=2,4
          timeout 120 env GCRY_SOUND=1 GCRY_STRESS=1 GCRY_STRESS_EVERY=32 ./bin/stress 100
          # Fully conservative: sound roots + no layout tables.
          GCRY_SOUND=1 GCRY_DISABLE_LAYOUT=1 ./bin/json_churn 800
          GCRY_SOUND=1 GCRY_DISABLE_LAYOUT=1 ./bin/pattern_fuzz --seed=2 --phases=20 --objects-per-phase=1000

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: coverage
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Create output dirs
        run: mkdir -p bin coverage

      - name: Unreachable methods
        run: |
          crystal tool unreachable --format codecov spec/all_specs.cr > coverage/unreachable.codecov.json || true
          echo "Unreachable methods:"
          crystal tool unreachable spec/all_specs.cr 2>/dev/null | wc -l

      - name: Macro code coverage
        run: |
          crystal tool macro_code_coverage --format codecov spec/all_specs.cr > coverage/macro_coverage.codecov.json || true
          echo "Macro coverage report generated"

      - name: Build spec binary for kcov
        run: crystal build spec/all_specs.cr -o bin/all_specs --error-trace

      - name: Install kcov (Debian package)
        run: |
          wget -q http://ftp.debian.org/debian/pool/main/k/kcov/kcov_43+dfsg-1+b4_amd64.deb -O /tmp/kcov.deb
          sudo dpkg -i /tmp/kcov.deb 2>/dev/null || sudo apt-get install -fy -qq
          kcov --version

      - name: Run kcov
        run: |
          kcov --clean \
               --include-path="$PWD/src" \
               --exclude-pattern='/.shards' \
               coverage \
               bin/all_specs \
               --order=random
          # Print summary
          if [ -f coverage/index.json ]; then
            python3 -c "import json; d=json.load(open('coverage/index.json')); print('Coverage: ' + str(d.get('covered_lines',0)) + '/' + str(d.get('total_lines',0)) + ' lines')" 2>/dev/null || echo "Coverage summary unavailable"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: asan
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Build ASan spec binary
        run: |
          mkdir -p bin
          crystal build -Dasan spec/all_specs.cr -o bin/all_specs_asan --error-trace

      - name: Run ASan specs
        run: |
          bin/all_specs_asan

  # `make monitor-gate-deadlock` in a job of its own: 106–193 s here, and the
  # worst case is 23 quick tries plus one 60 s hang, so a two-core runner needs
  # room the `test` job does not have — it is already at its 30-minute ceiling,
  # and adding a gate to it once cancelled a run mid-step.
  monitor-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: monitor gate
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      # The control arm has to reach the deadlock or the green arm proves
      # nothing, and it reaches it about one try in four and a half — measured
      # over eight runs, which hung on tries 1, 2, 3, 4, 5, 6, 7 and 8. Six
      # tries left a ~22% chance of a spurious red, which is why this gate was
      # out of CI; twenty-four leaves ~0.3%, and 8 of 8 runs passed.
      - name: Monitor gate deadlock
        run: |
          make monitor-gate-deadlock

  # `make dormant-flush-race` returns to CI below. It was wired in for one day
  # and took the v0.21.0 tag run red on its default arm — that was the `0x18`
  # crash, an open defect at the time, not the gate misbehaving. The defect is
  # closed (the chunk-index insert publish order, 0.21.2 — and the follow-up
  # STW write-protocol fixes on top): measured 0 crashes across 780 children of
  # the same arm on the fixed tree in one day, against 8–44 per 100 before.
  # The gate's own bar from that history — show it green repeatedly before
  # wiring — is met.
  #
  # One race gate stays deliberately NOT wired: `make page-release-corruption`.
  # It went green end to end for the first time on 2026-08-27
  # (`bench/log/linux/2026-08-27-stw-write-protocols/`), but its
  # `GCRY_PAGE_DONTNEED=1` arm keeps a documented unsound window (the
  # mask-to-DONTNEED race) that no fix has closed — a red there would be the
  # arm's own nature, not a regression. Run it by hand; `docs/HARDENING.md`
  # carries the numbers.
  dormant-flush-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: dormant flush race
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      # Two arms, six bounded children each: queued (default) must be clean,
      # immediate (the old behaviour) must fault — a control that stops
      # reaching the race turns the queued arm's silence into no evidence,
      # and the gate says so instead of passing.
      - name: Dormant flush race
        run: |
          make dormant-flush-race


  oom-no-hang:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: oom no hang
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      # Deterministic, unlike the race gates around it: the child caps its own
      # RLIMIT_AS, retains everything, and must report an out-of-memory error
      # inside the deadline. 3 of 3 children hung before the fix, 0 of 3 after,
      # on both the large and the small path — so a red here is a regression
      # and never a coin toss.
      - name: Out of memory must not hang
        run: |
          make oom-no-hang

  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: valgrind
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build samples for valgrind
        run: |
          mkdir -p bin
          crystal build -Dgc_none samples/hello.cr -o bin/hello_valgrind
          crystal build -Dgc_none samples/min.cr -o bin/min_valgrind
          crystal build -Dgc_none samples/alloc.cr -o bin/alloc_valgrind
          crystal build -Dgc_none samples/stress.cr -o bin/stress_valgrind

      - name: Valgrind memcheck hello
        run: ./ci/valgrind-wrap.sh ./bin/hello_valgrind

      - name: Valgrind memcheck min
        run: ./ci/valgrind-wrap.sh ./bin/min_valgrind

      - name: Valgrind memcheck alloc 500
        run: ./ci/valgrind-wrap.sh ./bin/alloc_valgrind 500

      - name: Valgrind memcheck stress 300
        run: ./ci/valgrind-wrap.sh ./bin/stress_valgrind 300

  # Short Kemal thr gate vs Boehm (needs wrk).
  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: perf smoke (kemal /json vs Boehm)
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Kemal A/B thr+RSS+pause gate
        run: |
          mkdir -p bin
          # Thr floor 65%: GHA often lands ~68–88% and has flaked at 68.1/68.4
          # under a 70% gate. RSS×/pause catch pause-campaign regressions;
          # quiet tip ~85% @ ~0.8× @ ~0.6ms.
          # The floors below are the catastrophe net. The baseline comparison
          # perf_smoke.sh runs at the end is the sensitive half — report-only
          # until a baseline with a tolerance measured on this runner class is
          # recorded and committed (bench/baseline/perf_smoke.json).
          PORT=3011 WRK_DURATION=5 WRK_CONNECTIONS=50 BENCH_RUNS=3 \
            MIN_PCT=65 MAX_RSS_X=1.25 MAX_PAUSE_P50_MS=2.5 \
            RUNNER_LABEL=ubuntu-latest \
            ./bench/perf_smoke.sh

      - name: Kemal E2E (endpoints + 60s load)
        run: |
          mkdir -p bin
          KEMAL_E2E_DURATION=60 PORT=3021 ./bench/kemal_e2e.sh

      - name: EC4 soft-soak smoke (Parallel TLAB-off, N=5)
        run: |
          mkdir -p bin
          make soft-soak-ec4-smoke

      - name: Upload perf report
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-report
          path: bench/log/
          retention-days: 30

  # Weekly soak (Monday 06:00 UTC — see schedule cron above), and on demand.
  #
  # It used to ask for 24 h on a runner GitHub cancels at 6 h, so it could not
  # pass: 2026-08-03 was cancelled at 6h00m14s, and 2026-08-10 only ever reported
  # because it crashed first (SEGV at 1h24m). 5 h fits, with headroom for the
  # build and the drain. The 24 h number lives on locally — `make soak`.
  soak:
    # `soak_duration: 0` opts out. Any dispatch used to start all three 5 h
    # arms, so asking this workflow for anything else — a rate measurement, a
    # one-off gate — cost fifteen runner-hours nobody wanted. The schedule is
    # unaffected and a dispatch that leaves the default alone still soaks.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak_duration != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Three arms, concurrently. One 5 h arm a week cannot chase a crash that took
    # 1h24m to arrive — at that cadence a candidate fix and a quiet run are the
    # same observation. Three tripled the sample rate for the same wall clock,
    # and `fail-fast: false` is the point: an arm that crashes must not cancel
    # the two that might have crashed differently.
    strategy:
      fail-fast: false
      matrix:
        arm: [1, 2, 3]
    name: soak (5h, arm ${{ matrix.arm }})
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Build soak test
        run: |
          mkdir -p bin
          crystal build -Dgc_none bench/soak.cr -o bin/soak --error-trace

      - name: Run soak test
        env:
          SOAK_DURATION: ${{ github.event.inputs.soak_duration || '18000' }}
          GCRY_MONITOR_GATE: ${{ github.event.inputs.monitor_gate == 'off' && '0' || '1' }}
          GCRY_STW_TEST_STALL_MS: ${{ github.event.inputs.stall_ms || '0' }}
          # The 2026-08-10 SEGV surfaced in the dequeue, an unknown time after the
          # write that caused it. This walks the run queues at every collection
          # and prints the first one that holds something other than a live Fiber,
          # so a crashing run says *when* the slot went bad instead of only that
          # it did. Costs a bounded walk inside the pause; on by default here
          # because that is what this job is for.
          GCRY_EC_QUEUE_AUDIT: ${{ github.event.inputs.ec_queue_audit == 'off' && '0' || '1' }}
          # A use-after-free then reads 0xdeadf2ee… instead of something that
          # looks like data. `GCRY_POISON_HOLDERS` rather than the plain poison,
          # and for the same memset: it implies the address **tag**, the crash
          # report, and a search of the root set, the heap and the fiber stacks
          # for whatever still points at the freed block. Untagged poison names
          # no block — measured on 2026-08-16, when `ec-queue-audit` caught the
          # open use-after-free in CI and the report could only say so. A 5 h
          # arm that catches this once must not waste the sighting.
          GCRY_POISON_HOLDERS: ${{ github.event.inputs.poison_freed == 'off' && '0' || '1' }}
          # Explain whatever address the run dies on against the heap's own
          # tables, instead of leaving one hex number behind like 2026-08-10 did.
          # Implied by POISON_HOLDERS; set explicitly so turning that off does
          # not silently take the crash report with it.
          GCRY_SEGV_REPORT: "1"
          FIBER_CHURN: ${{ github.event.inputs.fiber_churn || '0' }}
          SOAK_RSS_LIMIT_KB: ${{ github.event.inputs.soak_rss_limit_kb || '4096' }}
          COLLECT_HZ: ${{ github.event.inputs.collect_hz || '1' }}
        run: |
          # --fiber-churn=0 is the baseline every earlier soak ran on, and the
          # one the open 2026-08-10 SEGV is measured against; raise it (with the
          # RSS ceiling) only for a hunting run.
          ./bin/soak --duration="$SOAK_DURATION" \
            --fiber-churn="$FIBER_CHURN" \
            --collect-hz="$COLLECT_HZ" \
            --rss-limit-kb="$SOAK_RSS_LIMIT_KB" \
            --telemetry=/tmp/gcry-soak.log

      # The run that fails is the one whose telemetry is worth having, and it was
      # the one run that discarded it: 2026-08-10 crashed, so this step was
      # skipped and the hours before the SEGV went with it.
      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-telemetry-arm-${{ matrix.arm }}
          path: /tmp/gcry-soak.log
          retention-days: 30

  # aarch64 cross-compile smoke (object emit). Runs on PR + push.
  test-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: test (aarch64 cross-compile)
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Cross-compile samples for aarch64-linux-gnu
        run: |
          mkdir -p bin
          crystal build -Dgc_none --cross-compile --target aarch64-linux-gnu samples/hello.cr -o bin/hello_aarch64
          crystal build -Dgc_none --cross-compile --target aarch64-linux-gnu samples/min.cr -o bin/min_aarch64
          crystal build -Dgc_none --cross-compile --target aarch64-linux-gnu samples/alloc.cr -o bin/alloc_aarch64
          test -f bin/hello_aarch64.o
          test -f bin/min_aarch64.o
          test -f bin/alloc_aarch64.o

  # musl LibC ABI smoke (object emit). Catches PthreadT/Void* and similar typedef
  # mismatches that glibc hosts do not exercise (Alpine / static musl).
  test-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: test (musl cross-compile)
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Cross-compile samples for ${{ matrix.target }}
        run: |
          mkdir -p bin
          suffix="${{ matrix.target }}"
          crystal build -Dgc_none --cross-compile --target "$suffix" samples/hello.cr -o "bin/hello_${suffix}"
          crystal build -Dgc_none --cross-compile --target "$suffix" samples/min.cr -o "bin/min_${suffix}"
          crystal build -Dgc_none --cross-compile --target "$suffix" samples/alloc.cr -o "bin/alloc_${suffix}"
          test -f "bin/hello_${suffix}.o"
          test -f "bin/min_${suffix}.o"
          test -f "bin/alloc_${suffix}.o"

  # How often does the *locked* arm of `large-cache-race` fault on aarch64?
  #
  # Run 32862284372 caught it at 1 of 5 on the default configuration, and the
  # same job was green on the run before and the run after — so a green job
  # says nothing and 5 attempts is not a rate. Dispatch-only, and skipped
  # unless `lcr_attempts` is set, so it never touches push CI. `|| true`
  # because the tally is the output here, not the verdict.
  aarch64-lcr-rate:
    if: github.event_name == 'workflow_dispatch' && inputs.lcr_attempts != '0'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    name: aarch64 large-cache-race rate
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Sample the locked arm
        env:
          # Batches of 20 rather than one long invocation. The gate prints its
          # tally only at the end, so a single run of 250 attempts that hits the
          # job ceiling yields *nothing* — which is what happened on run
          # 32880389706, cancelled at 60 minutes with no number. Twenty at a
          # time prints as it goes and a timeout costs one batch.
          # SEGV_REPORT only. GCRY_RELEASE_LEDGER=1 was here and it invalidated
          # the measurement: the ledger made `update_heap_bounds_after_unmap`
          # scan up to 8192 slots per chunk on a walk the trimmer runs in a
          # loop, children went from ~1 s to ~114 s, and every one of them was
          # killed on the harness deadline and counted as a fault.
          GCRY_SEGV_REPORT: "1"
        run: |
          mkdir -p bin
          crystal build -Dgc_none bench/large_cache_race.cr -o bin/large_cache_race --error-trace
          want=${{ inputs.lcr_attempts }}
          batch=20
          locked=0
          done_n=0
          while [ "$done_n" -lt "$want" ]; do
            out=$(LARGE_CACHE_RACE_ATTEMPTS=$batch bin/large_cache_race 2>&1 || true)
            # Everything except the banner: the filter used to drop the gate's
            # own FAIL lines, which are the ones that say whether a failure was
            # a fault or a killed child.
            printf '%s\n' "$out" | grep -vE "^(===|4 workers|[0-9]+ attempts)" || true
            n=$(printf '%s\n' "$out" | sed -n 's/.*locked (default): *\([0-9][0-9]*\) of.*/\1/p' | head -1)
            locked=$((locked + ${n:-0}))
            done_n=$((done_n + batch))
            echo "  running total: $locked locked-arm faults in $done_n attempts"
          done
          echo "TOTAL: $locked locked-arm faults in $done_n attempts"

  # Native aarch64 (GitHub ubuntu-24.04-arm).
  test-aarch64-native:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    name: test (aarch64 native)
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      # `scheduler-roots` and `ec-queue-audit` carry `GCRY_THREAD_BLOCK_AUDIT=1`
      # from the Makefile: six of the eight sightings of the `Thread`
      # use-after-free are on this runner, and the question they leave open —
      # what held the `Thread`'s address when its block was swept — can only be
      # answered where the defect happens. It has not reproduced locally in
      # three days, so the instrument goes to it rather than the other way
      # round. `thread-block-audit` is that instrument's own gate, run here so a
      # silent arm on this arch is distinguishable from a broken one.
      # Every gate is bounded, and the reason is a hang this job has been having
      # in silence. Six of the last forty runs of this job ended `cancelled` at
      # the 20-minute job timeout, and every one that was checked was killed in
      # the same place: `Terminate orphan process: … (ec_queue_audit)`. A
      # cancelled job is not a red job, so a ~15% hang rate on the runner where
      # the open `Thread` use-after-free lives has never been read as a defect.
      #
      # `timeout` turns it into a failure with whatever the run had printed, and
      # the watchdog makes the collector say so from the inside: if the hang is
      # a stopped world that never restarts, it prints `STOP-THE-WORLD STALLED
      # <n> ms in phase=<name>` rather than going quiet until the runner gives
      # up. 300 s against gates that take seconds.
      - name: Unit + process specs + STW SP + fork on aarch64
        env:
          GCRY_STW_WATCHDOG_MS: "10000"
        run: |
          mkdir -p bin
          crystal spec --error-trace
          crystal spec -Dgc_none process_spec --error-trace
          crystal build -Dgc_none samples/hello.cr -o bin/hello
          ./bin/hello
          crystal build -Dgc_none samples/stw_sp_clamp.cr -o bin/stw_sp_clamp
          ./bin/stw_sp_clamp
          crystal build -Dgc_none -Dwithout_mt samples/fork_reinit.cr -o bin/fork_reinit
          ./bin/fork_reinit
          timeout 300 make greg-roots
          timeout 300 make scheduler-roots
          timeout 300 make ivar-layout-roots
          timeout 300 make ec-queue-audit
          timeout 300 make thread-block-audit
          timeout 300 make thread-birth-root
          # This arch is where the crash was first seen, so it gates here too.
          FIND_BLOCK_RACE_RUNS=3 timeout 600 make find-block-race
          timeout 600 make large-cache-race

  # Sampling, not gating. The `Thread` use-after-free fires in roughly one
  # aarch64 job in three and has never been seen off CI — 40 runs of the same
  # harness locally produced 0 crashes and 0 reports, while the same arm
  # reported 72 dying `Thread`s in `thread-storm` on that machine. The arm that
  # names the holder only speaks when the defect happens, so this job runs the
  # failing harness ten times to be told ten times as often, and uploads
  # whatever it caught.
  #
  # `continue-on-error` because the defect is **open**: a step expected to fail
  # would either block every pull request or teach everyone to ignore a red
  # mark. The gates that must stay green are elsewhere; this one collects
  # evidence.
  thread-uaf-sample:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    continue-on-error: true
    name: thread UAF sampler (aarch64)
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Run the failing harness ten times with the arm on
        run: make thread-uaf-sample

      - name: Upload what it caught
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-uaf-samples
          path: bench/log/ci-samples/
          if-no-files-found: ignore
          retention-days: 30

  # Native macOS (Apple Silicon runner). Soft-dirty stays Linux-only.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    name: test (darwin native)
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Unit + process specs + samples on Darwin
        run: |
          mkdir -p bin
          crystal spec --error-trace
          crystal spec -Dgc_none process_spec --error-trace
          crystal build -Dgc_none samples/hello.cr -o bin/hello
          ./bin/hello
          crystal build -Dgc_none samples/min.cr -o bin/min
          ./bin/min
          crystal build -Dgc_none samples/alloc.cr -o bin/alloc
          ./bin/alloc 500
          crystal build -Dgc_none samples/stress.cr -o bin/stress
          ./bin/stress 300
          crystal build -Dgc_none samples/json_churn.cr -o bin/json_churn
          ./bin/json_churn 800
          crystal build -Dgc_none samples/stw_sp_clamp.cr -o bin/stw_sp_clamp
          ./bin/stw_sp_clamp
          crystal build -Dgc_none -Dwithout_mt samples/fork_reinit.cr -o bin/fork_reinit
          ./bin/fork_reinit
          make greg-roots
          make scheduler-roots
          make ivar-layout-roots
          make ec-queue-audit
          make perf-baseline

      # Two more of the ~40 gates the Linux job runs and this one did not. The
      # STW × TLAB property test is a correctness gate for a UAF class that was
      # real (process-STW × TLAB freelist), and it is platform code on both
      # sides of the suspend. The soak smoke needed a Darwin RSS reader first —
      # its `/proc/self/status` reader returned 0 here, which passed the RSS
      # ceiling by measuring nothing (bench/bench_rss.cr).
      - name: STW × TLAB property test
        env:
          # Darwin runs all three arms through the Makefile, and the one that
          # crashed here on 2026-08-22 — `find_block` under `tlab_alloc_small`,
          # faulting on `0xffffffff00000012` — is the TLAB+nursery one. It
          # printed a Crystal backtrace and nothing from gcry, because none of
          # these were set. Same set as the x86_64 job's arms.
          GCRY_POISON_HOLDERS: "1"
          GCRY_THREAD_CENSUS: "1"
          GCRY_THREAD_BLOCK_AUDIT: "1"
        run: |
          make stw-mt-property-test-short

      # The v0.21.0 Darwin low-water skip is blocked on one question, and it is
      # not a code question: does `mach_vm_page_query`'s disposition separate
      # "never faulted" from "written then evicted"? Only a Darwin host can
      # answer it. It has now answered four fifths of it (2026-08-15): untouched
      # pages read skippable, written ones do not, every skippable page read
      # zero, and an `MADV_FREE_REUSABLE` page read zero whatever its bits said.
      # The fifth arm — a page that leaves residency with its contents intact —
      # needs the host to compress, and a runner will not do that on its own, so
      # it returns INCONCLUSIVE and exits 0. `page_query_pressure` is how a
      # dispatch attempts it; a non-zero exit means the bits are demonstrably
      # wrong, which is itself the answer.
      - name: mach_vm_page_query disposition bits
        env:
          # Empty rather than '0' on the push path: the Makefile expands this
          # with `${VAR:+…}`, so empty means the flag is not passed at all and a
          # push runs the exact command line it ran before this input existed.
          # A dispatch that leaves the field at its 0 default passes
          # `--pressure=0`, which the probe already treats as no pressure.
          PAGE_QUERY_PRESSURE: ${{ github.event.inputs.page_query_pressure || '' }}
        run: make darwin-page-query

      # Gated as of 2026-08-15. This ran ungated because the +4 MB ceiling was
      # measured on Linux and Darwin reclaims differently (MADV_FREE_REUSABLE
      # keeps pages mapped where MADV_DONTNEED drops them), so nobody knew what
      # Darwin does. Four green runs now say, and they say the Linux number
      # holds — no Darwin ceiling had to be invented after all:
      #
      #   +2880 kB  +3136 kB  +2384 kB  +2640 kB   (max RSS 10.6–11.4 MB)
      #
      # Worst is +3136 against a +4096 ceiling: 960 kB of headroom, 1.28x the
      # 752 kB spread across the four. Darwin does run ~2.9x Linux's ~1 MB
      # re-fault, which is why this needed measuring rather than assuming.
      # Raise the ceiling only against more runs, never to quiet one red.
      - name: Soak smoke
        run: |
          make soak-smoke

      # First run of the debug invariant checker on Darwin. It failed on Linux
      # and Darwin alike until 2026-08-15 (the walk counted every block of a
      # dormant chunk), and nothing ran it here — which is why it shipped in
      # three releases. `spec/invariant_spec.cr` pins the two cases without the
      # env var; this step is the whole suite under the checker.
      - name: Debug invariants on Darwin
        run: |
          GCRY_DEBUG_INVARIANTS=1 crystal spec --error-trace
