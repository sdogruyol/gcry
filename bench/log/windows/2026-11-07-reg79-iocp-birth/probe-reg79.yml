name: probe-reg79
on:
  push:
    branches: ["probe/reg79-collect"]
jobs:
  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [default, headers, freelist]
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANGARM64
          update: true
      - name: Install ARM64 linker and libraries
        shell: msys2 {0}
        run: ./ci/windows-arm64-msys2.sh
      - name: Install pinned native ARM64 Crystal
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./ci/install-windows-arm64.ps1 -Msys2Location $env:MSYS2_LOCATION
      - name: Loop
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          ./ci/probe-loop.ps1 -Variant $env:VARIANT -Runs 150
          $a = $LASTEXITCODE
          ./ci/probe-loop.ps1 -Variant $env:VARIANT -Runs 100 -Specs 27_boehm_collect_parity -Builds debug
          if ($a -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
  x64:
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [default, headers, freelist]
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"
      - name: Loop
        shell: pwsh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          ./ci/probe-loop.ps1 -Variant $env:VARIANT -Runs 150
          $a = $LASTEXITCODE
          ./ci/probe-loop.ps1 -Variant $env:VARIANT -Runs 100 -Specs 27_boehm_collect_parity -Builds debug
          if ($a -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
