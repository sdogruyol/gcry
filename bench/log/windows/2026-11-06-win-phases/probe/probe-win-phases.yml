name: Probe win phases

# Probe only, deleted afterwards. Windows JsonParsePure and Binarytrees on
# the 0.40 tip against 0.39.0: every 16-byte phase of both trees (unpadded,
# prepadded 16/32/48/64), plus the src at 2c600dfb (WinRows' measured state)
# and at e7efe740 (half of the commits since) at four phases each. Round 2:
# JsonParsePure, the tip less each group of the commits after e7efe740
# (bench/runner_ab/probe/rv-*.patch, src only) at four phases each.
on:
  push:
    branches: [probe/win-phases]

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        session: [s1, s2, s3]
    runs-on: windows-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"
      - env:
          AB_BASE: c0d570c52793cfa144d88f3f4b600c839f7a40ce
          AB_REPS: "21"
          AB_BENCHES: "JsonParsePure Fannkuchredux"
          AB_BOEHM: "0"
          AB_PADS: "p16 p32 p48 p64 bp16 bp32 bp48 bp64"
          AB_PATCHES: >-
            hot=bench/runner_ab/probe/rv-hot.patch
            hot=bench/runner_ab/probe/rv-hot.patch:p16
            hot=bench/runner_ab/probe/rv-hot.patch:p32
            hot=bench/runner_ab/probe/rv-hot.patch:p48
            heap=bench/runner_ab/probe/rv-heap.patch
            heap=bench/runner_ab/probe/rv-heap.patch:p16
            heap=bench/runner_ab/probe/rv-heap.patch:p32
            heap=bench/runner_ab/probe/rv-heap.patch:p48
            scrub=bench/runner_ab/probe/rv-scrub.patch
            scrub=bench/runner_ab/probe/rv-scrub.patch:p16
            scrub=bench/runner_ab/probe/rv-scrub.patch:p32
            scrub=bench/runner_ab/probe/rv-scrub.patch:p48
            monitor=bench/runner_ab/probe/rv-monitor.patch
            monitor=bench/runner_ab/probe/rv-monitor.patch:p16
            monitor=bench/runner_ab/probe/rv-monitor.patch:p32
            monitor=bench/runner_ab/probe/rv-monitor.patch:p48
            incr=bench/runner_ab/probe/rv-incr.patch
            incr=bench/runner_ab/probe/rv-incr.patch:p16
            incr=bench/runner_ab/probe/rv-incr.patch:p32
            incr=bench/runner_ab/probe/rv-incr.patch:p48
          AB_OUT: bench/log/_ab
        run: |
          pwsh -c '(Get-CimInstance Win32_Processor).Name' > cpu.txt
          cat cpu.txt
          bench/runner_ab/ab.sh
          cp cpu.txt bench/log/_ab/
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-win-phases-${{ matrix.session }}
          path: bench/log/_ab/
          if-no-files-found: ignore
          retention-days: 30
